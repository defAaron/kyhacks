      <circle r="12" fill="#8FA28A"/>
      <circle cx="-4" cy="1" r="3.5" fill="#F7F4ED"/>
      <circle cx="4" cy="1" r="3.5" fill="#F7F4ED"/>
    </g>
    <g transform="translate(1360 190)">
      <circle r="26" fill="#FFFCF6" stroke="#C8A96B" stroke-width="4"/>
      <circle r="11" fill="#C8A96B"/>
      <path d="M-6 3h12v4h-12z" fill="#F7F4ED"/>
    </g>
    <g transform="translate(380 470)">
      <circle r="30" fill="#FFFCF6" stroke="#C8A96B" stroke-width="4"/>
      <circle r="13" fill="#C8A96B"/>
      <path d="M0 -7 L5 5 H-5 Z" fill="#F7F4ED"/>
    </g>
    <g transform="translate(760 470)">
      <circle r="36" fill="#FFFCF6" stroke="#8FA28A" stroke-width="5"/>
      <circle r="15" fill="#8FA28A"/>
      <rect x="-9" y="-3" width="18" height="9" rx="4" fill="#F7F4ED"/>
      <circle cx="0" cy="-6" r="3" fill="#C8A96B"/>
    </g>
    <g transform="translate(1200 520)">
      <circle r="30" fill="#FFFCF6" stroke="#C8A96B" stroke-width="4"/>
      <circle r="13" fill="#C8A96B"/>
      <path d="M-7 2 Q0 -9 7 2 Z" fill="#F7F4ED"/>
    </g>
    <g transform="translate(520 720)">
      <circle r="27" fill="#FFFCF6" stroke="#8FA28A" stroke-width="4"/>
      <circle r="11" fill="#8FA28A"/>
      <circle cx="0" cy="0" r="4" fill="#F7F4ED"/>
    </g>
    <g transform="translate(700 740)">
      <circle r="25" fill="#FFFCF6" stroke="#C8A96B" stroke-width="4"/>
      <circle r="10" fill="#C8A96B"/>
      <rect x="-6" y="-2" width="12" height="7" rx="2" fill="#F7F4ED"/>
    </g>
    <g transform="translate(1040 760)">
      <circle r="28" fill="#FFFCF6" stroke="#8FA28A" stroke-width="4"/>
      <circle r="12" fill="#8FA28A"/>
      <path d="M-6 -1h12v6h-12zM-3 -5h6v4h-6z" fill="#F7F4ED"/>
    </g>
    <g transform="translate(1320 510)">
      <circle r="24" fill="#FFFCF6" stroke="#8FA28A" stroke-width="4"/>
      <circle r="10" fill="#8FA28A"/>
      <circle cx="-3" cy="0" r="2.5" fill="#F7F4ED"/>
      <circle cx="3" cy="0" r="2.5" fill="#F7F4ED"/>

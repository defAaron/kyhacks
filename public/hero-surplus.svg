    <radialGradient id="glow" cx="78%" cy="18%" r="38%">
      <stop offset="0%" stop-color="#C8A96B" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#8FA28A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8FA28A" stop-opacity="0"/>

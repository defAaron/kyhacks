<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe4d2"/>
      <stop offset="45%" stop-color="#e8f0e3"/>
      <stop offset="100%" stop-color="#d8e8cf"/>
    </linearGradient>
    <radialGradient id="sun" cx="78%" cy="18%" r="35%">
      <stop offset="0%" stop-color="#e0a84a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#e0a84a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e0a84a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a574"/>
      <stop offset="100%" stop-color="#9a7a4a"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#efe4d2"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Atmosphere -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- Soft window light plane -->
  <path d="M980 0 L1600 0 L1600 520 L1040 420 Z" fill="#fffaf2" opacity="0.35"/>
  <path d="M1100 40 L1560 40 L1560 380 L1160 320 Z" fill="#f7f1e6" opacity="0.25"/>

  <!-- Counter / table as full-width plane -->
  <path d="M0 470 C280 420 620 500 900 455 C1180 410 1380 480 1600 440 L1600 900 L0 900 Z" fill="url(#wood)"/>
  <path d="M0 470 C280 420 620 500 900 455 C1180 410 1380 480 1600 440 L1600 510 C1380 545 1180 475 900 520 C620 565 280 485 0 535 Z" fill="#b89563" opacity="0.55"/>

  <!-- Produce crate left -->
  <g transform="translate(90 390)">
    <rect x="0" y="40" width="280" height="170" rx="10" fill="#6b4f2e"/>
    <rect x="12" y="52" width="256" height="146" rx="6" fill="#8a6640"/>
    <ellipse cx="70" cy="110" rx="38" ry="28" fill="#3f6b3a"/>
    <ellipse cx="118" cy="128" rx="34" ry="26" fill="#2f5430"/>
    <ellipse cx="160" cy="105" rx="32" ry="24" fill="#5a8f4d"/>
    <ellipse cx="210" cy="130" rx="36" ry="27" fill="#244226"/>
    <circle cx="95" cy="155" r="18" fill="#c8892d"/>
    <circle cx="145" cy="168" r="16" fill="#e0a84a"/>
    <circle cx="190" cy="158" r="17" fill="#a46c1c"/>
  </g>

  <!-- Stainless tray with surplus meal -->
  <g transform="translate(430 360)">
    <ellipse cx="220" cy="210" rx="230" ry="36" fill="#1f2a1c" opacity="0.18" filter="url(#soft)"/>
    <rect x="0" y="20" width="440" height="200" rx="28" fill="#d9cbb4"/>
    <rect x="16" y="36" width="408" height="168" rx="20" fill="url(#tray)"/>
    <!-- rice / grain base -->
    <ellipse cx="150" cy="130" rx="90" ry="48" fill="#f3ead8"/>
    <ellipse cx="150" cy="124" rx="78" ry="40" fill="#efe4d2"/>
    <!-- greens -->
    <path d="M250 90 C290 70 340 85 355 115 C330 145 275 150 245 130 C235 115 235 100 250 90Z" fill="#3f6b3a"/>
    <path d="M265 100 C295 88 330 100 338 120 C318 138 280 140 260 122 C252 112 255 104 265 100Z" fill="#5a8f4d"/>
    <!-- roasted pieces -->
    <ellipse cx="300" cy="155" rx="42" ry="22" fill="#a46c1c"/>
    <ellipse cx="345" cy="148" rx="28" ry="16" fill="#c8892d"/>
    <ellipse cx="270" cy="168" rx="30" ry="14" fill="#8a5520"/>
    <!-- herb sprinkle -->
    <circle cx="120" cy="105" r="3" fill="#2f5430"/>
    <circle cx="170" cy="98" r="2.5" fill="#3f6b3a"/>
    <circle cx="200" cy="140" r="3" fill="#244226"/>
    <circle cx="095" cy="145" r="2.5" fill="#3f6b3a"/>
  </g>

  <!-- Takeaway containers -->
  <g transform="translate(980 420)">
    <ellipse cx="90" cy="150" rx="95" ry="22" fill="#1f2a1c" opacity="0.16"/>
    <rect x="10" y="20" width="160" height="120" rx="14" fill="#fffaf2" stroke="#d9cbb4" stroke-width="4"/>
    <rect x="22" y="34" width="136" height="92" rx="8" fill="#eef5ea"/>
    <ellipse cx="90" cy="78" rx="48" ry="28" fill="#c8892d"/>
    <ellipse cx="90" cy="72" rx="36" ry="18" fill="#e0a84a"/>
    <path d="M55 95 C75 110 105 110 125 95" stroke="#3f6b3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(1180 450)">
    <ellipse cx="85" cy="140" rx="90" ry="20" fill="#1f2a1c" opacity="0.14"/>
    <rect x="8" y="18" width="154" height="112" rx="14" fill="#fffaf2" stroke="#d9cbb4" stroke-width="4"/>
    <rect x="20" y="32" width="130" height="84" rx="8" fill="#f7f1e6"/>
    <circle cx="60" cy="70" r="22" fill="#b1432f" opacity="0.85"/>
    <circle cx="95" cy="78" r="20" fill="#c8892d"/>
    <circle cx="120" cy="65" r="16" fill="#3f6b3a"/>
  </g>

  <!-- Bread loaf -->
  <g transform="translate(780 520)">
    <ellipse cx="90" cy="70" rx="100" ry="28" fill="#1f2a1c" opacity="0.12"/>
    <ellipse cx="90" cy="48" rx="95" ry="40" fill="#c8892d"/>
    <ellipse cx="90" cy="40" rx="82" ry="30" fill="#e0a84a"/>
    <path d="M40 35 Q90 10 140 35" stroke="#a46c1c" stroke-width="3" fill="none" opacity="0.5"/>
  </g>

  <!-- Soft vignette for text legibility zone -->
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f7f1e6" stop-opacity="0.55"/>
    <stop offset="40%" stop-color="#f7f1e6" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#f7f1e6" stop-opacity="0"/>
  </linearGradient>
  <rect width="1600" height="520" fill="url(#fade)"/>
</svg>
